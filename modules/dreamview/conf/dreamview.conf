--flagfile=/apollo/modules/common/data/global_flagfile.txt
# Legacy Dreamview on 8899 so it can run beside Dreamview Plus (8888);
# scripts/bootstrap.sh also checks it at 8899. The flag defaults to 8888.
--server_ports=8899
# Its own frontend: the flag defaults to Dreamview Plus's, whose websocket
# protocol this backend does not speak (the page stalls at "Websocket Connect").
--static_file_dir=/apollo/modules/dreamview/frontend/dist
# The point cloud is drawn from the 128-beam lidar (the flag defaults to the
# 64-beam height file); the vehicle's velodyne_params are copied here.
--lidar_height_yaml=/apollo/modules/localization/msf/params/velodyne_params/velodyne128_height.yaml

# If you are in package develop mode, use profiles change vehicle type.
# --vehicles_config_path=/apollo_workspace/profiles
# --vehicle_changed_use_copy_mode=false