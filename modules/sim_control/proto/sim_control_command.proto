syntax = "proto2";

package apollo.sim_control;

// Commands Dreamview sends to the standalone sim_control process.
enum SimControlCommandType {
  START = 1;
  STOP = 2;
  RESET = 3;
  RESTART = 4;
  SET_POSITION = 5;
  LOAD_DYNAMIC_MODELS = 6;
  ADD_DYNAMIC_MODEL = 7;
  CHANGE_DYNAMIC_MODEL = 8;
  DELETE_DYNAMIC_MODEL = 9;
  IS_ENABLED = 10;
}

message SimControlCommand {
  optional SimControlCommandType command = 1;
  optional string dynamic_model_name = 2;
  optional double x = 3;
  optional double y = 4;
  optional double heading = 5;
  // When true, RESTART uses (x, y) as the start point.
  optional bool has_pose = 6;
  // Map directory from the caller. The sim_control process reloads its HD map
  // when this differs from the map it currently has loaded.
  optional string map_dir = 7;
}

message SimControlCommandResult {
  optional bool success = 1;
  optional bool enabled = 2;
  optional string message = 3;
  repeated string loaded_dynamic_models = 4;
}
