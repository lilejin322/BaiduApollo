syntax = "proto2";

package apollo.sim_control;

// Commands Dreamview sends to the standalone sim_control process.
enum SimControlCommandType {
  START = 1;
  STOP = 2;
  RESET = 3;
  RESTART = 4;
  SET_POSITION = 5;
  LOAD_DYNAMIC_MODELS = 6;
  ADD_DYNAMIC_MODEL = 7;
  CHANGE_DYNAMIC_MODEL = 8;
  DELETE_DYNAMIC_MODEL = 9;
  IS_ENABLED = 10;
}

message SimControlCommand {
  optional SimControlCommandType command = 1;
  optional string dynamic_model_name = 2;
  optional double x = 3;
  optional double y = 4;
  optional double heading = 5;
  // When true, RESTART uses (x, y) as the start point.
  optional bool has_pose = 6;
  // Map directory from the caller. The sim_control process reloads its HD map
  // when a map-using command carries a directory that differs from the map it
  // currently has loaded. Stop and status commands ignore this field.
  optional string map_dir = 7;
  // name=value gflags that used to be shared because Dreamview and sim_control
  // were one process. use_navigation_mode is applied on every command. Channel
  // names are applied only before a dynamic model binds its readers.
  repeated string shared_flag = 8;
}

message SimControlCommandResult {
  optional bool success = 1;
  optional bool enabled = 2;
  optional string message = 3;
  repeated string loaded_dynamic_models = 4;
  optional string current_dynamic_model = 5;
  // Stable for one sim_control process. Dreamview uses a change to detect a
  // restart and restore the model the HMI still has selected.
  optional uint64 instance_id = 6;
  optional bool model_running = 7;
  optional bool use_navigation_mode = 8;
}
